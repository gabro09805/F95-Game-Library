services:
  f95-library:
    build: .
    container_name: f95-library
    restart: unless-stopped
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - f95-library_data:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: f95-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info

volumes:
  f95-library_data:
